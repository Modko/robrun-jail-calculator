:root{
  --board:#474747;--board-dot:#4f4f4f;--line:#d9d9d9;--lit:#f0b45a;
  --tile:#2b2b2b;--tile-border:#1f1f1f;--tile-text:#a3a3a3;
  --tile-on:#b9b9b9;--tile-on-text:#161616;
  --panel:#262626;--panel-2:#303030;--text:#ececec;--muted:#a9a9a9;--rule:#3d3d3d;
  --accent:#f0b45a;--accent-text:#1b1408;
  --paper:#f4f1ea;--paper-text:#1d1d1d;
  --mono:"IBM Plex Mono",ui-monospace,monospace;--cond:"Barlow Condensed",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--board);color:var(--text);font:14px/1.45 Barlow,system-ui,sans-serif;overflow:hidden}
.app{position:relative;height:100vh;display:flex}
.viewport{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--board);background-image:radial-gradient(var(--board-dot) 1px,transparent 1px);background-size:22px 22px}
.viewport.dragging{cursor:grabbing}
.viewport{-webkit-user-select:none;user-select:none}
.viewport .overlay{-webkit-user-select:text;user-select:text}
.world svg,.world .polaroid{-webkit-user-drag:none}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.tile{position:absolute;width:48px;height:48px;padding:0;border:1px solid var(--tile-border);background:var(--tile);color:var(--tile-text);
  font:600 8.5px/1.05 var(--cond);letter-spacing:.01em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;
  box-shadow:0 1px 0 rgba(0,0,0,.35)}
.tile .lbl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding:0 3px;min-width:0;max-width:100%;overflow-wrap:normal;word-break:normal}
.tile .tier{position:absolute;left:3px;top:2px;font:700 7px/1 var(--cond);color:inherit;opacity:.8}
.tile .jail{position:absolute;right:-6px;bottom:-7px;font:600 8px/1 var(--mono);background:#1a1a1a;color:var(--accent);border:1px solid #5b4a2c;padding:2px 3px}
.tile .jail.ok{color:#9fd6a6;border-color:#355a3b}
.tile .qty{position:absolute;right:-6px;top:-7px;font:600 8px/1 var(--mono);background:var(--accent);color:var(--accent-text);padding:2px 4px}
.tile .ext{position:absolute;left:-1px;bottom:-1px;width:0;height:0;border-left:7px solid var(--accent);border-top:7px solid transparent}
.tile.on{background:var(--tile-on);color:var(--tile-on-text);border-color:#d8d8d8}
.tile.bought{box-shadow:inset 0 -4px 0 var(--accent),0 1px 0 rgba(0,0,0,.35)}
.tile.sel{outline:2px solid #ffffff;outline-offset:2px}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.polaroid{position:absolute;background:var(--paper);color:var(--paper-text);padding:5px 5px 0;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.polaroid::before{content:"";position:absolute;left:50%;top:-6px;width:30px;height:11px;transform:translateX(-50%) rotate(-3deg);background:rgba(220,220,210,.75)}
.polaroid .pic{background:#2f2a24;display:flex;align-items:center;justify-content:center;color:#d9c9a8}
.polaroid .cap{font:italic 700 11px/1 var(--cond);text-transform:uppercase;text-align:center;padding:4px 0 5px;text-decoration:underline;text-underline-offset:2px}
.cat .pic{width:60px;height:60px}
.cat .pic svg{width:34px;height:34px}
.cat .badge{position:absolute;right:-8px;top:-8px;font:600 10px/1 var(--mono);background:var(--accent);color:var(--accent-text);padding:3px 5px}
.hub .pic{width:132px;height:112px;flex-direction:column;background:#1f1c18}
.hub .num{font:600 40px/1 var(--mono);color:var(--accent)}
.hub .unit{font:600 12px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase;color:#d9c9a8;margin-top:6px}
.hub .cap{font-size:13px;color:#b0201c;text-decoration:none;font-style:normal;transform:rotate(-2deg)}
.hub .desc{font:500 10px/1.25 Barlow,sans-serif;color:#3a3a3a;padding:0 2px 6px;max-width:132px}
.overlay{position:absolute;z-index:5}
.titlebox{left:16px;top:14px;background:rgba(38,38,38,.92);border:1px solid var(--rule);padding:10px 12px;max-width:360px}
.titlebox h1{font:700 20px/1.1 var(--cond);letter-spacing:.02em;margin:0 0 4px;text-transform:uppercase}
.titlerow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.langpick{position:relative;flex-shrink:0}
.langbtn{display:flex;align-items:center;gap:7px;font:600 12px/1.2 Barlow,system-ui,sans-serif;background:#1c1c1c;color:var(--text);border:1px solid var(--rule);padding:5px 8px;cursor:pointer}
.langbtn::after{content:"";border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--muted);margin-left:1px}
.langbtn[aria-expanded=true]::after{border-top:0;border-bottom:5px solid var(--muted)}
.langbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.langlist{position:absolute;right:0;top:calc(100% + 4px);z-index:10;min-width:180px;margin:0;padding:4px 0;list-style:none;background:var(--panel);border:1px solid var(--rule);box-shadow:0 8px 20px rgba(0,0,0,.5)}
.langlist li{display:flex;align-items:center;gap:9px;padding:7px 12px;font-size:13px;color:var(--text);cursor:pointer}
.langlist li:hover,.langlist li:focus{background:var(--panel-2);outline:none}
.langlist li:focus-visible{box-shadow:inset 3px 0 0 var(--accent)}
.langlist li[aria-selected=true]{color:var(--accent)}
.flag{display:block;width:20px;height:14px;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.55)}
.titlebox p{margin:0;color:var(--muted);font-size:12.5px}
.legend{display:flex;gap:6px 16px;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--text);flex-wrap:wrap}
.legend > span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:18px;height:18px;flex-shrink:0;border:1px solid #8a8a8a}
.legend .sw-locked{background:var(--tile)}
.legend .sw-unlocked{background:var(--tile-on);border-color:#d8d8d8}
.legend .sw-bought{background:var(--tile-on);border-color:#d8d8d8;box-shadow:inset 0 -5px 0 var(--accent)}
.zoom{left:16px;bottom:16px;display:flex;gap:6px}
.zoom button,.plain{font:600 13px/1 Barlow,sans-serif;background:var(--panel);color:var(--text);border:1px solid var(--rule);padding:8px 11px;cursor:pointer}
.zoom button:focus-visible,.plain:focus-visible,.act:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.detail{left:16px;bottom:64px;width:270px;background:rgba(38,38,38,.96);border:1px solid var(--rule);padding:12px}
.detail h2{font:700 17px/1.15 var(--cond);margin:0 0 6px;text-transform:uppercase;letter-spacing:.02em}
.detail .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.detail dl{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:0 0 10px;font-size:13px}
.detail dt{color:var(--muted)}.detail dd{margin:0;text-align:right;font-family:var(--mono)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{font:600 13px/1 Barlow,sans-serif;padding:9px 8px;border:1px solid var(--rule);background:var(--panel-2);color:var(--text);cursor:pointer}
.act[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.stepper{display:grid;grid-template-columns:32px 1fr 32px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-text)}
.stepper button{font:700 15px/1 Barlow,sans-serif;border:0;background:transparent;color:inherit;cursor:pointer}
.stepper span{display:flex;align-items:center;justify-content:center;font:600 12px/1 var(--mono)}
.side{width:320px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--rule);overflow:auto;padding:16px}
.side h2{font:700 18px/1 var(--cond);text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px}
.big{font:600 44px/1 var(--mono);color:var(--accent)}
.big-label{color:var(--muted);font-size:13px;margin-top:4px}
dl.stats{display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin:14px 0 0;font-size:13.5px}
dl.stats dt{color:var(--muted)}dl.stats dd{margin:0;text-align:right;font-family:var(--mono)}
.bar{height:6px;background:var(--panel-2);margin-top:12px}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.bar-label{font-size:11.5px;color:var(--muted);margin-top:4px}
.note{background:#3a3020;border-left:3px solid var(--accent);padding:8px 10px;font-size:12.5px;margin-top:12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fields .wide{grid-column:1/-1}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.search{margin-top:10px}
input[type=text],input[type=search]{width:100%;padding:8px 9px;border:1px solid var(--rule);background:#1c1c1c;color:var(--text);font:500 14px/1.2 var(--mono)}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.check label{margin:0;color:var(--text);font-size:13px}
.hint{font-size:11.5px;color:var(--muted);margin:6px 0 0}
details{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:13.5px}
.extra{display:grid;grid-template-columns:1fr 92px auto;gap:6px;margin-top:8px}
.extra input{font-family:Barlow,sans-serif}
.picked{list-style:none;padding:0;margin:8px 0 0;font-size:12.5px;max-height:220px;overflow:auto}
.picked li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--rule)}
.picked li span:last-child{font-family:var(--mono);white-space:nowrap}
.src{font-size:11px;color:var(--muted);margin-top:16px}
.src a{color:var(--accent)}
.src.checked{color:var(--text)}
.src.checked + .src{margin-top:4px}
.supportbox{margin-top:14px}
.support{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 14px;background:var(--accent);color:var(--accent-text);border:1px solid var(--accent);font:700 15px/1 var(--cond);letter-spacing:.04em;text-transform:uppercase;text-decoration:none}
.support svg{width:18px;height:18px;flex-shrink:0}
.support:hover{background:#f5c47a;border-color:#f5c47a}
.support:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.supportbox .hint{text-align:center}
.feedback{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.feedback[hidden]{display:none}
.fb{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border:1px solid var(--rule);background:var(--panel-2);color:var(--text);font:600 12.5px/1.15 Barlow,system-ui,sans-serif;text-align:center;text-decoration:none}
.fb svg{width:15px;height:15px;flex-shrink:0;color:var(--muted)}
.fb:hover{border-color:var(--accent)}
.fb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fblink{grid-column:1/-1;justify-self:center;margin-top:2px;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.fblink:hover{color:var(--accent)}
.fblink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.share{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:12px}
.share svg{width:15px;height:15px;flex-shrink:0;color:var(--muted)}
.share:hover{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:20px;z-index:20;transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);padding:10px 14px;background:#1c1c1c;color:var(--text);border:1px solid var(--rule);border-left:3px solid var(--accent);box-shadow:0 8px 20px rgba(0,0,0,.5);font-size:13px}
.toast[hidden],.toast-undo[hidden]{display:none}
.toast-undo{flex-shrink:0;padding:4px 8px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:600 12.5px/1 Barlow,system-ui,sans-serif;cursor:pointer}
.toast-undo:hover{background:var(--accent);color:var(--accent-text)}
.toast-undo:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media (max-width:900px){
  body{overflow:auto}
  .app{flex-direction:column;height:auto}
  .viewport{height:75vh;flex:none}
  .side{width:auto;border-left:0;border-top:1px solid var(--rule)}
  .detail{width:auto;right:16px}
  .titlebox{right:16px;max-width:none}
}

  const FIELD_IDS = ["current", "today", "bank", "cash", "other", "rate", "base", "capState", "capDay", "capTotal"];
  const STORAGE_KEY = "robrun-jail-v4";
  const LANG_KEY = "robrun-lang";
  const SUPPORT_URL = "https://ko-fi.com/modko";
  const PRICES_CHECKED = "2026-11-20";
  const SHARE_PACKED = "#b=";
  const SHARE_PLAIN = "#j=";
  const SHARE_MAX_QTY = 999;
  const SHARE_MAX_TEXT = 100;
  const TOAST_MS = 5000;
  const TOAST_UNDO_MS = 10000;
  const FEEDBACK_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScLpY6e9iu8rGOJBG-EOl0wsKRyuzonXnHPzyZgfgWAE6aIqg/viewform";
  const FEEDBACK_TYPE_ENTRY = "1274521845";
  const FEEDBACK_DESCRIPTION_ENTRY = "610068089";
  const FEEDBACK_TYPES = { bug: "Bug", feature: "Feature idea", translation: "Translation issue" };
  const feedbackEnabled = FEEDBACK_FORM_URL.startsWith("https://");

  const feedbackUrl = (type, description = "") => {
    const url = new URL(FEEDBACK_FORM_URL);
    if (FEEDBACK_TYPE_ENTRY) {
      url.searchParams.set("usp", "pp_url");
      url.searchParams.set(`entry.${FEEDBACK_TYPE_ENTRY}`, FEEDBACK_TYPES[type]);
      if (description && FEEDBACK_DESCRIPTION_ENTRY) url.searchParams.set(`entry.${FEEDBACK_DESCRIPTION_ENTRY}`, description);
    }
    return url.href;
  };
  const SVG_NS = "http://www.w3.org/2000/svg";
  const byId = (id) => document.getElementById(id);
  let lang = "en";
  let money = null;
  let yearsFmt = null;
  const t = (key, ...args) => {
    const value = I18N[lang][key];
    return typeof value === "function" ? value(...args) : value;
  };
  const formatMoney = (value) => `$${money.format(value)}`;
  const formatYears = (value) => t("years", yearsFmt.format(value));

  const applyLanguage = (next) => {
    lang = I18N[next] ? next : "en";
    money = new Intl.NumberFormat(t("locale"), { maximumFractionDigits: 0 });
    yearsFmt = new Intl.NumberFormat(t("locale"), { maximumFractionDigits: 2 });
    document.documentElement.lang = lang;
    document.title = t("pageTitle");
    document.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = t(node.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach((node) => { node.setAttribute("aria-label", t(node.dataset.i18nAria)); });
    const checkedDate = new Intl.DateTimeFormat(t("locale"), { dateStyle: "long", timeZone: "UTC" }).format(new Date(`${PRICES_CHECKED}T00:00:00Z`));
    byId("pricesChecked").textContent = t("pricesChecked", checkedDate);
    const currentName = LANGUAGES.find(([code]) => code === lang)[1];
    byId("langBtn").replaceChildren(flagSvg(lang), el("span", { lang, text: currentName }));
    byId("langBtn").setAttribute("aria-label", `${t("language")}: ${currentName}`);
    byId("search").placeholder = t("search");
    const translationLink = byId("translationLink");
    translationLink.hidden = !feedbackEnabled || lang === "en";
    if (!translationLink.hidden) translationLink.href = feedbackUrl("translation", `Language: ${currentName}\n\n`);
    byId("langList").querySelectorAll("[role=option]").forEach((option) => option.setAttribute("aria-selected", String(option.dataset.code === lang)));
    document.querySelectorAll("#extras .extra").forEach((row) => {
      const [nameInput, priceInput] = row.querySelectorAll("input");
      nameInput.placeholder = t("itemName");
      nameInput.setAttribute("aria-label", t("itemNameLabel"));
      priceInput.setAttribute("aria-label", t("itemValueLabel"));
      const removeButton = row.querySelector("button");
      removeButton.textContent = t("remove");
      removeButton.setAttribute("aria-label", t("removeLabel"));
    });
    try { localStorage.setItem(LANG_KEY, lang); } catch { }
  };

  const initialLanguage = () => {
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved && I18N[saved]) return saved;
    } catch { }
    const browser = (navigator.languages || [navigator.language || ""])
      .map((code) => String(code).slice(0, 2).toLowerCase())
      .find((code) => I18N[code]);
    return browser || "en";
  };

  const state = { unlocked: new Set(), bought: new Map(), selected: null };
  const view = { x: 0, y: 0, scale: 1 };
  let layout = null;
  let lastGain = 0;

  const parseAmount = (raw) => {
    const text = String(raw).trim().toLowerCase().replace(/[\s$]/g, "").replace(",", ".");
    const match = text.match(/^(\d*\.?\d+)([kmb]?)$/);
    if (!match) return 0;
    const value = parseFloat(match[1]) * { "": 1, k: 1e3, m: 1e6, b: 1e9 }[match[2]];
    return Number.isFinite(value) ? value : 0;
  };

  const el = (tag, props = {}, children = []) => {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([key, value]) => {
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key === "style") Object.assign(node.style, value);
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value);
    });
    node.append(...children);
    return node;
  };

  const svgEl = (tag, attrs) => {
    const node = document.createElementNS(SVG_NS, tag);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
    return node;
  };

  const sameCatKids = (item) => (childrenOf.get(item.id) || [])
    .filter((child) => child.cat === item.cat);

  const buildLayout = () => {
    const positions = new Map();
    const cats = [];
    Object.entries(CATEGORIES).forEach(([id, cat]) => {
      const roots = ITEMS.filter((item) => item.cat === id && (!item.requires || itemById.get(item.requires).cat !== id));
      const local = new Map();
      const measure = (item) => {
        const kids = sameCatKids(item);
        const width = kids.length ? kids.reduce((sum, kid) => sum + measure(kid), 0) : 1;
        local.set(item.id, { width, kids });
        return width;
      };
      const place = (item, left, depth) => {
        const info = local.get(item.id);
        if (!info.kids.length) info.x = (left + 0.5) * SLOT;
        else {
          let cursor = left;
          info.kids.forEach((kid) => { place(kid, cursor, depth + 1); cursor += local.get(kid.id).width; });
          info.x = (local.get(info.kids[0].id).x + local.get(info.kids[info.kids.length - 1].id).x) / 2;
        }
        info.y = cat.dir * (CARD_HALF + 58 + depth * LEVEL);
      };
      let total = 0;
      roots.forEach((root) => { total += measure(root); });
      let cursor = 0;
      roots.forEach((root) => { place(root, cursor, 0); cursor += local.get(root.id).width; });
      const first = local.get(roots[0].id).x;
      const last = local.get(roots[roots.length - 1].id).x;
      cats.push({ id, cat, roots, local, width: total * SLOT, center: (first + last) / 2 });
    });

    const placeSide = (side) => {
      const lanes = { "-1": side > 0 ? HUB_HALF_W + LANE_GAP : -(HUB_HALF_W + LANE_GAP), "1": side > 0 ? HUB_HALF_W + LANE_GAP : -(HUB_HALF_W + LANE_GAP) };
      let lastCard = 0;
      cats.filter((c) => c.cat.side === side).sort((a, b) => a.cat.order - b.cat.order).forEach((c) => {
        const lane = String(c.cat.dir);
        let cx;
        if (side > 0) {
          cx = Math.max(lanes[lane] + c.center, lastCard + CARD_GAP);
          lanes[lane] = cx - c.center + c.width + LANE_GAP;
        } else {
          cx = Math.min(lanes[lane] - (c.width - c.center), lastCard - CARD_GAP);
          lanes[lane] = cx - c.center - LANE_GAP;
        }
        lastCard = cx;
        c.cx = cx;
      });
    };
    placeSide(1);
    placeSide(-1);

    let minX = -HUB_HALF_W, maxX = HUB_HALF_W, minY = -HUB_HALF_H, maxY = HUB_HALF_H;
    cats.forEach((c) => {
      c.local.forEach((info, id) => {
        const x = c.cx - c.center + info.x;
        positions.set(id, { x, y: info.y, kids: info.kids, cat: c });
        minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, info.y); maxY = Math.max(maxY, info.y);
      });
    });
    const pad = 90;
    return { positions, cats, originX: -minX + pad, originY: -minY + pad, width: maxX - minX + pad * 2, height: maxY - minY + pad * 2, minX, maxX };
  };

  const prereqChain = (id) => {
    const chain = [];
    let current = itemById.get(id);
    while (current) {
      chain.push(current.id);
      current = current.requires ? itemById.get(current.requires) : undefined;
    }
    return chain;
  };

  const unlockWithPrereqs = (id) => {
    prereqChain(id).forEach((chainId) => state.unlocked.add(chainId));
  };

  const lockWithDependents = (id) => {
    state.unlocked.delete(id);
    state.bought.delete(id);
    (childrenOf.get(id) || []).forEach((child) => lockWithDependents(child.id));
  };

  const refocus = (key) => {
    const target = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
    if (target) target.focus({ preventScroll: true });
  };

  const toggleUnlock = (id) => {
    if (state.unlocked.has(id)) lockWithDependents(id);
    else unlockWithPrereqs(id);
    render();
    refocus("act-unlock");
  };

  const changeQty = (id, delta, key) => {
    const next = (state.bought.get(id) || 0) + delta;
    if (next <= 0) state.bought.delete(id);
    else { state.bought.set(id, next); unlockWithPrereqs(id); }
    render();
    refocus(next <= 0 ? "act-buy" : key);
  };

  const select = (id) => {
    state.selected = id;
    render();
    refocus(`tile:${id}`);
  };

  const drawConnector = (svg, px, py, parentHalf, dir, kids, isLit) => {
    if (!kids.length) return;
    const childY = kids[0].y;
    const startY = py + dir * parentHalf;
    const endY = childY - dir * TILE / 2;
    const midY = (startY + endY) / 2;
    const segments = [];
    segments.push({ d: `M${px} ${startY}V${midY}`, lit: kids.some((k) => isLit(k.id)) });
    kids.forEach((kid) => segments.push({ d: `M${px} ${midY}H${kid.x}V${endY}`, lit: isLit(kid.id) }));
    segments.sort((a, b) => Number(a.lit) - Number(b.lit)).forEach((seg) => {
      svg.append(svgEl("path", { d: seg.d, fill: "none", stroke: seg.lit ? "var(--lit)" : "var(--line)", "stroke-width": seg.lit ? 2 : 1.4, opacity: seg.lit ? 1 : 0.75 }));
    });
  };

  const iconSvg = (name) => {
    const svg = svgEl("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 1.6, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" });
    svg.append(svgEl("path", { d: ICONS[name] }));
    return svg;
  };

  const renderWorld = (currentJail) => {
    const world = byId("world");
    const { positions, cats, originX, originY, width, height, minX, maxX } = layout;
    world.style.width = `${width}px`;
    world.style.height = `${height}px`;
    world.replaceChildren();
    const svg = svgEl("svg", { width, height, viewBox: `0 0 ${width} ${height}` });
    const group = svgEl("g", { transform: `translate(${originX} ${originY})` });
    svg.append(group);
    group.append(svgEl("path", { d: `M${minX - 60} 0H${maxX + 60}`, stroke: "var(--line)", "stroke-width": 1.6, opacity: 0.9 }));
    const isLit = (id) => state.unlocked.has(id);
    const at = (id) => ({ ...positions.get(id), id });

    cats.forEach((c) => {
      drawConnector(group, c.cx, 0, CARD_HALF, c.cat.dir, c.roots.map((r) => at(r.id)), isLit);
      positions.forEach((pos, id) => {
        if (pos.cat !== c) return;
        drawConnector(group, pos.x, pos.y, TILE / 2, c.cat.dir, pos.kids.map((k) => at(k.id)), isLit);
      });
    });
    world.append(svg);

    cats.forEach((c) => {
      const picked = ITEMS.filter((item) => item.cat === c.id && (state.unlocked.has(item.id) || state.bought.has(item.id))).length;
      const card = el("div", { class: "polaroid cat", style: { left: `${originX + c.cx - 35}px`, top: `${originY - CARD_HALF}px`, transform: `rotate(${c.cat.side * c.cat.order % 2 ? -1.5 : 1.2}deg)` } }, [
        el("div", { class: "pic" }, [iconSvg(c.cat.icon)]),
        el("div", { class: "cap", text: t(`cat${c.id}`) })
      ]);
      if (picked) card.append(el("span", { class: "badge", text: String(picked) }));
      world.append(card);
    });

    const hub = el("div", { class: "polaroid hub", style: { left: `${originX - HUB_HALF_W}px`, top: `${originY - 78}px`, transform: "rotate(-1deg)" } }, [
      el("div", { class: "pic" }, [el("div", { class: "num", text: `+${yearsFmt.format(lastGain)}` }), el("div", { class: "unit", text: t("hubUnit") })]),
      el("div", { class: "cap", text: "Black Market" }),
      el("div", { class: "desc", text: t("hubDesc") })
    ]);
    world.append(hub);

    ITEMS.forEach((item) => {
      const pos = positions.get(item.id);
      const unlocked = state.unlocked.has(item.id);
      const qty = state.bought.get(item.id) || 0;
      const label = item.name.replace(/\s*\(([^)]*)\)/, " $1");
      const tile = el("button", {
        type: "button",
        class: `tile${unlocked ? " on" : ""}${qty ? " bought" : ""}${state.selected === item.id ? " sel" : ""}`,
        "data-key": `tile:${item.id}`,
        title: item.name,
        "aria-label": t("tileLabel", item.name, unlocked, qty),
        style: { left: `${originX + pos.x - TILE / 2}px`, top: `${originY + pos.y - TILE / 2}px` },
        onclick: () => select(item.id)
      });
      const labelSpan = el("span", { class: "lbl", text: label });
      tile.append(labelSpan);
      if (item.tier) tile.append(el("span", { class: "tier", text: TIER[item.tier] }));
      if (item.jail) tile.append(el("span", { class: `jail${currentJail >= item.jail ? " ok" : ""}`, text: t("jailBadge", item.jail) }));
      if (qty) tile.append(el("span", { class: "qty", text: `×${qty}` }));
      if (item.requires && itemById.get(item.requires).cat !== item.cat) tile.append(el("span", { class: "ext" }));
      world.append(tile);
      fitLabel(labelSpan, item.id);
    });
  };

  const labelSizes = new Map();
  const fitLabel = (span, key) => {
    if (labelSizes.has(key)) {
      span.style.fontSize = labelSizes.get(key);
      return;
    }
    const overflows = () => span.scrollWidth > span.clientWidth || span.scrollHeight > span.clientHeight;
    let size = LABEL_MAX_SIZE;
    span.style.fontSize = `${size}px`;
    while (size > LABEL_MIN_SIZE && overflows()) {
      size -= 0.5;
      span.style.fontSize = `${size}px`;
    }
    labelSizes.set(key, span.style.fontSize);
  };

  const renderDetail = (currentJail) => {
    const box = byId("detail");
    box.replaceChildren();
    const item = state.selected ? itemById.get(state.selected) : null;
    if (!item) {
      box.append(el("h2", { text: t("pickTile") }), el("div", { class: "meta", text: t("pickTileHint") }));
      return;
    }
    const unlocked = state.unlocked.has(item.id);
    const qty = state.bought.get(item.id) || 0;
    const meta = [item.tier ? t("district", TIER[item.tier]) : t("noDistrict"), t(`cat${item.cat}`)];
    if (item.requires) meta.push(t("requires", item.requires));
    box.append(el("h2", { text: item.name }), el("div", { class: "meta", text: meta.join(" · ") }));
    const dl = el("dl", {}, [
      el("dt", { text: t("unlockCost") }), el("dd", { text: item.unlock ? formatMoney(item.unlock) : t("free") }),
      el("dt", { text: t("price") }), el("dd", { text: formatMoney(item.price) })
    ]);
    if (item.jail) dl.append(el("dt", { text: t("jailNeeded") }), el("dd", { text: `${formatYears(item.jail)}${currentJail >= item.jail ? "" : t("missing")}` }));
    box.append(dl);
    const unlockBtn = el("button", { type: "button", class: "act", "data-key": "act-unlock", "aria-pressed": String(unlocked), text: unlocked ? t("unlocked") : t("unlock"), onclick: () => toggleUnlock(item.id) });
    const buy = qty
      ? el("div", { class: "stepper" }, [
          el("button", { type: "button", "data-key": "act-minus", "aria-label": t("less"), text: "−", onclick: () => changeQty(item.id, -1, "act-minus") }),
          el("span", { text: t("pieces", qty) }),
          el("button", { type: "button", "data-key": "act-plus", "aria-label": t("more"), text: "+", onclick: () => changeQty(item.id, 1, "act-plus") })
        ])
      : el("button", { type: "button", class: "act", "data-key": "act-buy", text: t("buy"), onclick: () => changeQty(item.id, 1, "act-plus") });
    box.append(el("div", { class: "acts" }, [unlockBtn, buy]));
  };

  const createExtraRow = (name = "", price = "") => {
    const nameInput = el("input", { type: "text", placeholder: t("itemName"), "aria-label": t("itemNameLabel") });
    const priceInput = el("input", { type: "text", inputmode: "decimal", placeholder: "$", "aria-label": t("itemValueLabel") });
    nameInput.value = name;
    priceInput.value = price;
    const row = el("div", { class: "extra" }, [nameInput, priceInput,
      el("button", { type: "button", class: "plain", text: t("remove"), "aria-label": t("removeLabel"), onclick: () => { row.remove(); render(); } })]);
    nameInput.addEventListener("input", render);
    priceInput.addEventListener("input", render);
    byId("extras").append(row);
    return nameInput;
  };

  const readExtras = () => Array.from(byId("extras").querySelectorAll(".extra")).map((row) => {
    const [nameInput, priceInput] = row.querySelectorAll("input");
    return { name: nameInput.value, price: priceInput.value, amount: parseAmount(priceInput.value) };
  });

  const snapshot = () => ({
    unlocked: [...state.unlocked], bought: [...state.bought],
    fields: Object.fromEntries(FIELD_IDS.map((id) => [id, byId(id).value])),
    lenny: byId("lenny").checked,
    extras: readExtras().map(({ name, price }) => ({ name, price }))
  });

  const applySnapshot = (saved) => {
    state.unlocked.clear();
    state.bought.clear();
    (saved.unlocked || []).forEach((id) => { if (itemById.has(id)) state.unlocked.add(id); });
    (saved.bought || []).forEach(([id, qty]) => { if (itemById.has(id) && Number.isInteger(qty) && qty > 0) state.bought.set(id, qty); });
    FIELD_IDS.forEach((id) => {
      const input = byId(id);
      input.value = saved.fields && id in saved.fields ? String(saved.fields[id]) : input.defaultValue;
    });
    byId("lenny").checked = Boolean(saved.lenny);
    byId("extras").replaceChildren();
    (saved.extras || []).forEach((row) => createExtraRow(String(row.name ?? ""), String(row.price ?? "")));
  };

  const save = () => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot())); } catch { }
  };

  const restore = () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) applySnapshot(JSON.parse(raw));
    } catch { }
  };

  const toBase64Url = (bytes) => btoa(Array.from(bytes, (byte) => String.fromCharCode(byte)).join(""))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const fromBase64Url = (text) => Uint8Array.from(atob(text.replace(/-/g, "+").replace(/_/g, "/")), (char) => char.charCodeAt(0));
  const pipeBytes = async (bytes, transform) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(transform)).arrayBuffer());
  const canCompress = typeof CompressionStream === "function" && typeof DecompressionStream === "function";

  const sharePayload = () => {
    const leaves = [...state.unlocked].filter((id) => !state.bought.has(id)
      && !(childrenOf.get(id) || []).some((child) => state.unlocked.has(child.id)));
    const fields = Object.fromEntries(FIELD_IDS
      .filter((id) => byId(id).value !== byId(id).defaultValue)
      .map((id) => [id, byId(id).value]));
    const extras = readExtras().filter((row) => row.name || row.price).map(({ name, price }) => [name, price]);
    return { u: leaves, b: [...state.bought], f: fields, l: byId("lenny").checked ? 1 : 0, e: extras };
  };

  const snapshotFromPayload = (payload) => {
    const ids = [...(payload.u || []), ...(payload.b || []).map(([id]) => id)].filter((id) => itemById.has(id));
    return {
      unlocked: [...new Set(ids.flatMap(prereqChain))],
      bought: (payload.b || []).map(([id, qty]) => [id, Math.min(Number(qty), SHARE_MAX_QTY)]),
      fields: Object.fromEntries(Object.entries(payload.f || {}).filter(([id]) => FIELD_IDS.includes(id))),
      lenny: payload.l === 1,
      extras: (payload.e || []).map(([name, price]) => ({ name: String(name).slice(0, SHARE_MAX_TEXT), price: String(price).slice(0, SHARE_MAX_TEXT) }))
    };
  };

  const encodeShare = async () => {
    const json = new TextEncoder().encode(JSON.stringify(sharePayload()));
    if (!canCompress) return `${SHARE_PLAIN}${toBase64Url(json)}`;
    return `${SHARE_PACKED}${toBase64Url(await pipeBytes(json, new CompressionStream("deflate-raw")))}`;
  };

  const decodeShare = async (hash) => {
    const packed = hash.startsWith(SHARE_PACKED);
    const bytes = fromBase64Url(hash.slice((packed ? SHARE_PACKED : SHARE_PLAIN).length));
    const json = packed ? await pipeBytes(bytes, new DecompressionStream("deflate-raw")) : bytes;
    return snapshotFromPayload(JSON.parse(new TextDecoder().decode(json)));
  };

  const isShareHash = (hash) => hash.startsWith(SHARE_PACKED) || hash.startsWith(SHARE_PLAIN);

  let toastTimer = 0;
  let undoSnapshot = null;
  const hideToast = () => {
    byId("toast").hidden = true;
    undoSnapshot = null;
  };
  const showToast = (message, previous = null) => {
    undoSnapshot = previous;
    byId("toastText").textContent = message;
    byId("toastUndo").hidden = !previous;
    byId("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, previous ? TOAST_UNDO_MS : TOAST_MS);
  };
  const undo = () => {
    if (!undoSnapshot) return;
    const undoWasFocused = document.activeElement === byId("toastUndo");
    applySnapshot(undoSnapshot);
    hideToast();
    render();
    if (undoWasFocused) byId("reset").focus();
  };
  const clearSelection = () => {
    const previous = snapshot();
    state.unlocked.clear();
    state.bought.clear();
    render();
    showToast(t("resetDone"), previous);
    byId("toastUndo").focus();
  };

  const copyShareLink = async () => {
    const url = new URL(location.href);
    url.hash = await encodeShare();
    try {
      await navigator.clipboard.writeText(url.href);
      showToast(t("shareCopied"));
    } catch {
      history.replaceState(null, "", url.href);
      showToast(t("shareManual"));
    }
  };

  const loadSharedFromHash = async () => {
    if (!isShareHash(location.hash)) return;
    const hash = location.hash;
    history.replaceState(null, "", location.pathname + location.search);
    try {
      const shared = await decodeShare(hash);
      const previous = snapshot();
      applySnapshot(shared);
      state.selected = null;
      render();
      showToast(t("shareLoaded"), previous);
    } catch {
      showToast(t("shareInvalid"));
    }
  };

  const renderPicked = (extras) => {
    const list = byId("picked");
    list.replaceChildren();
    const rows = [];
    ITEMS.forEach((item) => {
      if (state.unlocked.has(item.id) && item.unlock) rows.push([t("pickedUnlock", item.name), item.unlock]);
      const qty = state.bought.get(item.id);
      if (qty) rows.push([t("pickedBought", item.name, qty), item.price * qty]);
    });
    extras.filter((row) => row.amount > 0).forEach((row) => rows.push([row.name || t("itemFallback"), row.amount]));
    if (!rows.length) { list.append(el("li", { text: t("nothingYet") })); return; }
    rows.forEach(([name, amount]) => list.append(el("li", {}, [el("span", { text: name }), el("span", { text: formatMoney(amount) })])));
  };

  function render() {
    const current = parseAmount(byId("current").value);
    const today = parseAmount(byId("today").value);
    const bank = parseAmount(byId("bank").value);
    const cash = parseAmount(byId("cash").value);
    const otherField = parseAmount(byId("other").value);
    const rate = parseAmount(byId("rate").value) || 500000;
    const base = parseAmount(byId("base").value);
    const capState = parseAmount(byId("capState").value);
    const capDay = parseAmount(byId("capDay").value);
    const capTotal = parseAmount(byId("capTotal").value);
    const bonus = byId("lenny").checked ? 10 : 0;
    const extras = readExtras();

    const unlockValue = ITEMS.reduce((sum, item) => sum + (state.unlocked.has(item.id) ? item.unlock : 0), 0);
    const buyValue = ITEMS.reduce((sum, item) => sum + item.price * (state.bought.get(item.id) || 0), 0);
    const otherValue = otherField + extras.reduce((sum, row) => sum + row.amount, 0);
    const moneyValue = bank + cash;
    const value = unlockValue + buyValue + otherValue + moneyValue;

    const raw = value > 0 ? base + Math.floor(value / rate) : 0;
    const dayLeft = Math.max(0, capDay - today);
    const totalLeft = Math.max(0, capTotal - current);
    const fromRaid = Math.min(raw, capState, dayLeft);
    const gain = Math.min(fromRaid + bonus, totalLeft);
    lastGain = gain;
    const fullCapValue = Math.max(0, capState - base) * rate;

    byId("gain").textContent = `+${yearsFmt.format(gain)}`;
    byId("sValue").textContent = formatMoney(value);
    byId("sUnlock").textContent = formatMoney(unlockValue);
    byId("sBuy").textContent = formatMoney(buyValue);
    byId("sOther").textContent = formatMoney(otherValue);
    byId("sMoney").textContent = formatMoney(moneyValue);
    byId("sNew").textContent = formatYears(current + gain);
    byId("sNext").textContent = raw >= capState ? t("limit") : formatMoney(rate - (value % rate));

    const progress = capState > 0 ? Math.min(1, Math.min(raw, capState) / capState) : 0;
    byId("capBar").style.width = `${progress * 100}%`;
    byId("capLabel").textContent = t("capLabel", yearsFmt.format(Math.min(raw, capState)), yearsFmt.format(capState), formatMoney(fullCapValue));

    const notes = [];
    if (raw > capState) notes.push(t("noteOverCap", yearsFmt.format(raw - capState)));
    if (Math.min(raw, capState) > dayLeft) notes.push(t("noteDaily", yearsFmt.format(dayLeft)));
    if (fromRaid + bonus > totalLeft) notes.push(t("noteTotal", yearsFmt.format(capTotal)));
    const jailBlocked = ITEMS.filter((item) => state.unlocked.has(item.id) && item.jail > current).map((item) => item.name);
    if (jailBlocked.length) notes.push(t("noteJail", jailBlocked.join(", ")));
    byId("note").textContent = notes.join(" ");
    byId("note").hidden = !notes.length;

    renderWorld(current);
    renderDetail(current);
    renderPicked(extras);
    save();
  }

  const clampAxis = (offset, viewportSize, worldSize) => {
    const slack = viewportSize - worldSize * view.scale;
    return Math.min(Math.max(offset, Math.min(0, slack)), Math.max(0, slack));
  };

  const applyView = () => {
    const viewport = byId("viewport");
    view.x = clampAxis(view.x, viewport.clientWidth, layout.width);
    view.y = clampAxis(view.y, viewport.clientHeight, layout.height);
    byId("world").style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
  };

  const centerView = () => {
    const viewport = byId("viewport");
    view.scale = viewport.clientWidth < 700 ? 0.7 : 1;
    view.x = viewport.clientWidth / 2 - layout.originX * view.scale;
    view.y = viewport.clientHeight / 2 - layout.originY * view.scale;
    applyView();
  };

  const zoomAt = (factor, cx, cy) => {
    const next = Math.min(2, Math.max(0.35, view.scale * factor));
    const ratio = next / view.scale;
    view.x = cx - (cx - view.x) * ratio;
    view.y = cy - (cy - view.y) * ratio;
    view.scale = next;
    applyView();
  };

  const setupPanZoom = () => {
    const viewport = byId("viewport");
    let drag = null;
    let suppressClick = false;
    viewport.addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || event.target.closest("input, .overlay")) return;
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY, vx: view.x, vy: view.y, moved: false };
    });
    viewport.addEventListener("pointermove", (event) => {
      if (!drag || drag.id !== event.pointerId) return;
      const dx = event.clientX - drag.x;
      const dy = event.clientY - drag.y;
      if (!drag.moved) {
        if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
        drag.moved = true;
        viewport.setPointerCapture(event.pointerId);
        viewport.classList.add("dragging");
      }
      view.x = drag.vx + dx;
      view.y = drag.vy + dy;
      applyView();
    });
    viewport.addEventListener("click", (event) => {
      if (!suppressClick) return;
      suppressClick = false;
      event.stopPropagation();
      event.preventDefault();
    }, true);
    viewport.addEventListener("scroll", () => {
      if (!viewport.scrollLeft && !viewport.scrollTop) return;
      view.x -= viewport.scrollLeft;
      view.y -= viewport.scrollTop;
      viewport.scrollLeft = 0;
      viewport.scrollTop = 0;
      applyView();
    });
    const end = () => {
      if (drag && drag.moved) {
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 0);
      }
      drag = null;
      viewport.classList.remove("dragging");
    };
    viewport.addEventListener("pointerup", end);
    viewport.addEventListener("pointercancel", end);
    viewport.addEventListener("wheel", (event) => {
      if (event.target.closest(".overlay")) return;
      event.preventDefault();
      const rect = viewport.getBoundingClientRect();
      zoomAt(event.deltaY < 0 ? 1.12 : 1 / 1.12, event.clientX - rect.left, event.clientY - rect.top);
    }, { passive: false });
    const middle = () => [viewport.clientWidth / 2, viewport.clientHeight / 2];
    byId("zoomIn").addEventListener("click", () => zoomAt(1.2, ...middle()));
    byId("zoomOut").addEventListener("click", () => zoomAt(1 / 1.2, ...middle()));
    byId("center").addEventListener("click", centerView);
  };

  const findItem = (query) => {
    const needle = query.trim().toLowerCase();
    if (!needle) return null;
    const name = (item) => item.name.toLowerCase();
    return ITEMS.find((item) => name(item) === needle)
      || ITEMS.find((item) => name(item).startsWith(needle))
      || ITEMS.find((item) => name(item).includes(needle))
      || null;
  };

  const focusItem = (id) => {
    const pos = layout.positions.get(id);
    const viewport = byId("viewport");
    view.scale = Math.max(view.scale, 1);
    view.x = viewport.clientWidth / 2 - (layout.originX + pos.x) * view.scale;
    view.y = viewport.clientHeight / 2 - (layout.originY + pos.y) * view.scale;
    applyView();
    select(id);
  };

  const setupSearch = () => {
    const input = byId("search");
    byId("itemNames").append(...ITEMS.map((item) => el("option", { value: item.name })));
    byId("searchForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const item = findItem(input.value);
      if (item) focusItem(item.id);
      else if (input.value.trim()) showToast(t("searchNone"));
    });
    input.addEventListener("input", (event) => {
      if (event.inputType && event.inputType !== "insertReplacementText") return;
      const item = ITEMS.find((candidate) => candidate.name === input.value);
      if (item) focusItem(item.id);
    });
  };

  const setupLanguagePicker = () => {
    const button = byId("langBtn");
    const list = byId("langList");
    const options = LANGUAGES.map(([code, name]) => {
      const option = el("li", { role: "option", id: `lang-${code}`, tabindex: "-1", lang: code, "data-code": code }, [flagSvg(code), el("span", { text: name })]);
      option.addEventListener("click", () => choose(code));
      list.append(option);
      return option;
    });

    const close = (refocus) => {
      list.hidden = true;
      button.setAttribute("aria-expanded", "false");
      if (refocus) button.focus();
    };
    const open = () => {
      list.hidden = false;
      button.setAttribute("aria-expanded", "true");
      (options.find((option) => option.dataset.code === lang) || options[0]).focus();
    };
    const choose = (code) => {
      close(true);
      if (code === lang) return;
      applyLanguage(code);
      render();
    };

    button.addEventListener("click", () => (list.hidden ? open() : close(false)));
    button.addEventListener("keydown", (event) => {
      if (event.key === "ArrowDown" || event.key === "ArrowUp") { event.preventDefault(); open(); }
    });
    list.addEventListener("keydown", (event) => {
      const index = options.indexOf(document.activeElement);
      const moves = { ArrowDown: index + 1, ArrowUp: index - 1, Home: 0, End: options.length - 1 };
      if (event.key in moves) {
        event.preventDefault();
        options[(moves[event.key] + options.length) % options.length].focus();
      } else if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        if (index >= 0) choose(options[index].dataset.code);
      } else if (event.key === "Escape") {
        event.preventDefault();
        close(true);
      } else if (event.key === "Tab") {
        close(false);
      }
    });
    document.addEventListener("pointerdown", (event) => {
      if (!list.hidden && !event.target.closest("#langPick")) close(false);
    });
  };

  layout = buildLayout();
  if (SUPPORT_URL.startsWith("https://")) {
    byId("supportLink").href = SUPPORT_URL;
    byId("supportRow").hidden = false;
  }
  if (feedbackEnabled) {
    byId("bugLink").href = feedbackUrl("bug");
    byId("ideaLink").href = feedbackUrl("feature");
    byId("feedbackRow").hidden = false;
  }
  setupLanguagePicker();
  applyLanguage(initialLanguage());
  restore();
  FIELD_IDS.forEach((id) => byId(id).addEventListener("input", render));
  byId("lenny").addEventListener("change", render);
  byId("addExtra").addEventListener("click", () => { createExtraRow().focus(); });
  byId("reset").addEventListener("click", clearSelection);
  byId("toastUndo").addEventListener("click", undo);
  byId("shareBtn").addEventListener("click", copyShareLink);
  window.addEventListener("hashchange", loadSharedFromHash);
  setupSearch();
  setupPanZoom();
  window.addEventListener("resize", applyView);
  render();
  centerView();
  loadSharedFromHash();
  document.fonts.ready.then(() => {
    labelSizes.clear();
    render();
  });
})();
</script>
</body>
</html>
